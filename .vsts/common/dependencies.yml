steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Set NodeJS version

  # electron-builder 26 (app-builder-lib) require()s ESM-only @noble/hashes,
  # which needs Node's native require(ESM) support (Node >= 20.19 / >= 22.12).
  # OneBranch build containers may ignore NodeTool@0 and keep a baked-in Node
  # on PATH, so verify the ACTIVE node version here and fail fast with a clear
  # message instead of a cryptic ERR_REQUIRE_ESM during build:package.
  - pwsh: |
      $raw = (node --version).TrimStart('v')
      Write-Host "Active Node.js version: $raw"
      $v = [version]$raw
      if ($v -lt [version]'24.0.0') {
        Write-Error "Node.js $raw is too old. electron-builder 26 requires Node >= 24.0.0 (native require(ESM)). The build container/agent must provide Node 24+ on PATH."
        exit 1
      }
    displayName: Verify Node.js version

  - script: cp .vsts/common/pipelines.npmrc $(Agent.TempDirectory)/.npmrc
    displayName: Stage .npmrc file

  - task: npmAuthenticate@0
    displayName: NPM auth
    inputs:
      workingFile: $(Agent.TempDirectory)/.npmrc

  # Using the 'script' task as-written below doesn't work properly on Windows.
  # It seems to be adding an extra quote character somehow. Using a separate
  # powershell task for Windows gets around this issue.
  - script: |
      echo "##vso[task.setvariable variable=npm_config_userconfig]$(Agent.TempDirectory)/.npmrc"
    condition: ne( variables['Agent.OS'], 'Windows_NT' )
    displayName: Set NPM userconfig (Linux/MacOS)
  - pwsh: |
      Write-Host "##vso[task.setvariable variable=npm_config_userconfig]$env:AGENT_TEMPDIRECTORY\.npmrc"
    condition: eq( variables['Agent.OS'], 'Windows_NT' )
    displayName: Set NPM userconfig (Windows)
